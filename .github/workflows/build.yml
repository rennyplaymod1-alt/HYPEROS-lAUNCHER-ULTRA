name: Build APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug and release APKs
        run: gradle --no-daemon assembleDebug assembleRelease
      - name: Prepare APK files
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HyperUltraLauncher-debug.apk
          cp app/build/outputs/apk/release/app-release.apk HyperUltraLauncher-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HyperUltraLauncher-apk
          path: |
            HyperUltraLauncher-debug.apk
            HyperUltraLauncher-release.apk
      - name: Publish release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            HyperUltraLauncher-debug.apk
            HyperUltraLauncher-release.apk
